name: Feature request
description: Suggest a model, actuator, API or other improvement
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour or API you have in mind, with references for physics models.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
