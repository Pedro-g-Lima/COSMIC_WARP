name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # GitHub runners have no GPU: the suite runs on the Warp CPU backend.
    # CUDA-only tests (graph capture, training) skip, with the reason shown.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range's ends; the middle is covered by both
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # `pip install --group` needs pip 25.1
      - run: python -m pip install --upgrade "pip>=25.1"
      - run: python -m pip install -e . --group dev
      - run: pytest --device cpu -rs

  dependency-range:
    # The runtime requirements are ranges: test both ends. The golden
    # trajectories are bit-exact to the dev group's pinned Warp, so they are
    # deselected here; every analytic, tolerance and gradient check runs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.12", pins: "warp-lang==1.15.0 numpy==2.0.2 PyYAML==6.0.1"}
          - {python: "3.14", pins: ""}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest ${{ matrix.pins }}
      - run: python -m pip freeze | grep -iE "^(warp-lang|numpy|pyyaml)=="
      - run: pytest --device cpu -rs -m "not golden"

  wheel:
    # The built wheel, installed alone in a fresh environment and imported
    # from outside the checkout: catches files missing from the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps -w "$RUNNER_TEMP/dist"
      - run: python -m venv "$RUNNER_TEMP/wheel-env"
      - run: '"$RUNNER_TEMP/wheel-env/bin/pip" install "$RUNNER_TEMP"/dist/*.whl'
      - run: cp tests/wheel_smoke.py "$RUNNER_TEMP/"
      - working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/wheel-env/bin/python" wheel_smoke.py "$GITHUB_WORKSPACE"'

  rl:
    # The RL stack needs torch, which the physics job does not install:
    # bridge gradchecks, torch views, adapter interfaces, the RL examples and
    # the docs snippets that need torch, on CPU torch. PPO/SHAC training and
    # graph capture are only exercised on CUDA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade "pip>=25.1"
      # CPU wheels: the default torch wheels pull in the CUDA runtime
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[torch,rsl-rl,skrl,rl-games]" --group dev
      # Fail rather than silently skip every RL test if an import breaks
      - run: python -c "import torch, rsl_rl, skrl, rl_games"
      - run: >-
          pytest --device cpu -rs
          tests/test_rl_env.py tests/test_rl_diff_env.py tests/test_example_shac.py
          tests/test_rl_rsl_adapter.py tests/test_rl_skrl_adapter.py
          tests/test_rl_rlgames_adapter.py tests/test_docs.py tests/test_examples.py
